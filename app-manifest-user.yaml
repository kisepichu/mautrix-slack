display_information:
  name: Matrix bridge
  description: Bridges your Slack account to Matrix with mautrix-slack
oauth_config:
  scopes:
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - chat:write
      - reactions:read
      - reactions:write
      - files:read
      - files:write
      - users:read
      - emoji:read
      - team:read
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - channel_rename
      - group_rename
      - member_joined_channel
      - member_left_channel
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
